        <g transform="translate(0, 68)">
          <rect width="540" height="150" rx="8" fill="#241a0b" stroke="#543c18" />
          <text x="16" y="22" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Deal Pipeline Kanban Simulation</text>
          
          <rect x="20" y="38" width="115" height="92" rx="6" fill="#171107" stroke="#422f13" />
          <text x="28" y="55" fill="#f59e0b" font-family="sans-serif" font-size="10" font-weight="700">Inbound (12)</text>
          <rect x="26" y="65" width="103" height="26" rx="4" fill="#291e0c" />
          <text x="32" y="81" fill="#cbd5e1" font-family="sans-serif" font-size="8">Apex Logistics ($85k)</text>

          <rect x="150" y="38" width="115" height="92" rx="6" fill="#171107" stroke="#422f13" />
          <text x="158" y="55" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="700">Discovery (8)</text>
          <rect x="156" y="65" width="103" height="26" rx="4" fill="#291e0c" />
          <text x="162" y="81" fill="#cbd5e1" font-family="sans-serif" font-size="8">Vanguard Care ($120k)</text>

          <rect x="280" y="38" width="115" height="92" rx="6" fill="#171107" stroke="#422f13" />
          <text x="288" y="55" fill="#a855f7" font-family="sans-serif" font-size="10" font-weight="700">Proposal (5)</text>
          <rect x="286" y="65" width="103" height="26" rx="4" fill="#291e0c" />
          <text x="292" y="81" fill="#cbd5e1" font-family="sans-serif" font-size="8">Nordic Pharma ($240k)</text>

          <rect x="410" y="38" width="115" height="92" rx="6" fill="#0d261a" stroke="#10b981" />
          <text x="418" y="55" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="700">Closed Won (14)</text>
          <rect x="416" y="65" width="103" height="26" rx="4" fill="#123826" />
          <text x="422" y="81" fill="#a7f3d0" font-family="sans-serif" font-size="8">BioScan Labs ($310k)</text>
